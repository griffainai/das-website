<style>
    .auth-page {
      min-height: 100vh;
      background: var(--black-2);
      display: flex;
      flex-direction: column;
    }
    .auth-nav {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(241,244,247,0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
    }
    .auth-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-padding);
    }
    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 52px 48px 44px;
      width: 100%;
      max-width: 480px;
    }
    @media (max-width: 520px) {
      .auth-card { padding: 40px 28px 36px; }
    }
    .auth-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .auth-logo-wrap img { height: 44px; width: auto; }
    .auth-title {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.9375rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      padding: 13px 24px;
      border-radius: var(--radius-full);
      border: 1.5px solid #DADCE0;
      background: #fff;
      color: #3C4043;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
      margin-bottom: 20px;
    }
    .btn-google:hover { background: #F8F9FA; box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: scale(1.02); }
    .btn-google:active { transform: scale(0.98); }
    .auth-or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-weight: 500;
    }
    .auth-or::before, .auth-or::after { content: ''; flex: 1; border-top: 1px solid var(--black-5); }
    .auth-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 420px) { .auth-row { grid-template-columns: 1fr; } }
    .auth-field { margin-bottom: 18px; }
    .auth-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #D1D5DB;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      color: var(--text-primary);
      background: #fff;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
    }
    .auth-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(26,46,110,0.10);
    }
    .auth-input::placeholder { color: #9CA3AF; }
    .auth-input-wrap { position: relative; }
    .auth-input-wrap .auth-input { padding-right: 48px; }
    .auth-eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
    }
    .auth-eye-btn:hover { color: var(--gold); }
    .auth-eye-btn svg { width: 18px; height: 18px; }
    .eye-closed { display: none; }
    /* Password strength meter */
    .password-strength {
      height: 3px;
      border-radius: 2px;
      background: var(--black-5);
      margin-top: 8px;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 300ms ease, background 300ms ease;
    }
    .password-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    /* Terms checkbox */
    .auth-checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 22px;
    }
    .auth-checkbox-row input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      flex-shrink: 0;
      cursor: pointer;
    }
    .auth-checkbox-row label {
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.5;
      cursor: pointer;
    }
    .auth-checkbox-row a { color: var(--gold); font-weight: 600; text-decoration: none; }
    .auth-checkbox-row a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .auth-submit {
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--gold);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .auth-submit:hover { background: var(--gold-hover); transform: scale(1.03); box-shadow: var(--shadow-gold); }
    .auth-submit:active { transform: scale(0.97); }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #auth-error {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-sm);
      color: #B91C1C;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .auth-footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-footer-link a { color: var(--gold); font-weight: 600; text-decoration: none; }
    .auth-footer-link a:hover { text-decoration: underline; text-underline-offset: 3px; }
    /* Benefits strip */
    .signup-benefits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .signup-benefit {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .signup-benefit svg { width: 14px; height: 14px; color: var(--success); flex-shrink: 0; }
  </style>

<!-- ============================================================================
     DAS branded load screen (treatment A "polish"). Paints an opaque branded
     overlay INSTANTLY so the unbranded white / broken-image flash never shows on
     entry or navigation; fades out when the page is ready. Self-contained + inline
     so it paints before styles.css. Full splash once per visit, quick fade after.
     5s failsafe guarantees it never traps the page. prefers-reduced-motion aware.
     ============================================================================ -->
<style>
  /* ══ SUB-SPLASH — the Off Duty treatment, choreography matched ══════════
     First attempt was navy with a white knockout — the inverse of the
     reference. Second was the right colour but the mark just SLID: their mark
     is an inline SVG whose internal lines DRAW IN, and a PNG cannot stroke.
     Static next to theirs, and fairly called terrible.

     WHAT THEIRS ACTUALLY DOES (read off #odndr-splash):
       .osm    fly-in — translate3d(189%) scale(.2), springs on
               cubic-bezier(.34,1.56,.64,1), holds, slides home on
               cubic-bezier(.65,0,.35,1), 1.7s linear .08s both
       .oss path  the mark's HORIZONTAL LINES draw one after another —
               stroke-dashoffset 1.1 -> 0, .36s cubic-bezier(.4,0,.2,1),
               delay calc(.34s + var(--d) * 26ms)
       .osw    wordmark wipes open, clip-path inset(0 100% 0 0) -> 0,
               .56s cubic-bezier(.33,0,.2,1) at 1.68s

     WHY BANDS. Their mark is a circle crossed by horizontal rules, so
     "drawing" it means revealing those rules in sequence. The DAS mark is a
     chevron shield — hand-tracing it to strokable SVG would produce a worse
     mark than the real artwork. So the same artwork is layered 14 times, each
     clipped to one horizontal band, each carrying THEIR stagger: .34s start,
     26ms apart, .36s each, same easing. The mark builds top to bottom in
     sequence instead of appearing at once, which is what the eye reads as
     drawing. Every number above is theirs; only the mechanism differs, because
     ours is raster and theirs is vector.

     Self-contained and inline so it paints before styles.css. */
  html.das-splash-seen #das-splash{display:none!important}
  #das-splash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:0 24px;
    background:#fff;transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility linear .5s}
  #das-splash.das-done{opacity:0;visibility:hidden;pointer-events:none}
  #das-splash .dsl{position:relative;display:flex;align-items:center;width:min(86vw,780px);
    aspect-ratio:728/259;transform:translateZ(0);transition:transform .5s cubic-bezier(.4,0,.2,1)}
  #das-splash.das-done .dsl{transform:scale(1.03)}

  /* the mark: their fly-in, to the millisecond */
  #das-splash .dsm{position:relative;z-index:1;flex:0 0 auto;width:26.92%;opacity:0;
    transform:translate3d(189%,0,0) scale(.2);will-change:transform,opacity;
    animation:dasMark 1.7s linear .08s 1 both}
  /* ── THE MARK IS A VECTOR NOW, SO IT DRAWS ────────────────────────────
     Jayden asked why Off Duty's splash is so clean and ours was not. Theirs is
     an inline SVG: resolution-independent, a couple of KB, and — the part that
     actually matters — its geometry can be STROKE-DRAWN. Ours was a 728x259
     PNG, and a raster can only be scaled. Fourteen clipped copies fading in
     sequence was the closest a bitmap could get to drawing, and it read as the
     imitation it was.

     There was no DAS vector anywhere in the repo, so one was made: the mark is
     flat two-colour geometry with straight edges, and the print PDF for the
     Journal of Driver Recognition embeds it at 458x567. scripts/vectorize-mark.py
     traces that into 533 vertices of real path data — 7.7KB, against 56KB for
     the raster it replaces — and normalises it back to the lockup's true
     198x253 proportions, because the PDF's copy is stretched 4.6% wide.

     Now it genuinely draws. pathLength="1" lets the dash animate in units of
     one without anybody measuring the path: silhouette first, navy inlays
     after, then both fills come up underneath the line. Their stagger, their
     easing, our artwork. */
  #das-splash .dsm{aspect-ratio:192.90/247.26}
  #das-splash .dsm svg{display:block;width:100%;height:auto;overflow:visible}
  #das-splash .dsm path{
    fill-opacity:0; stroke-width:1.4; stroke-linejoin:round; vector-effect:non-scaling-stroke;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:dasDraw .64s cubic-bezier(.4,0,.2,1) both, dasFill .36s ease both;
  }
  #das-splash .dsm .p1{ stroke:#96A0AF; fill:#96A0AF; animation-delay:.30s, .88s }
  #das-splash .dsm .p2{ stroke:#1A2E5A; fill:#1A2E5A; animation-delay:.46s, 1.00s }
  #das-splash .dsw img{display:block;width:100%;height:auto}

  /* the wordmark: their wipe */
  #das-splash .dsw{position:relative;flex:0 0 auto;width:68.96%;margin-left:2.2%;overflow:hidden;
    clip-path:inset(0 100% 0 0);will-change:clip-path;
    animation:dasWipe .56s cubic-bezier(.33,0,.2,1) 1.68s 1 both}
  #das-splash .dsw img{display:block;width:100%;height:auto}

  @keyframes dasMark{
    0%{opacity:0;transform:translate3d(189%,0,0) scale(.2);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
    16%{opacity:1}
    36%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:linear}
    58%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes dasDraw{ to{stroke-dashoffset:0} }
  @keyframes dasFill{ to{fill-opacity:1} }
  @keyframes dasWipe{ to{clip-path:inset(0 0 0 0)} }

  /* second visit in a session: same look, no theatre */
  #das-splash.das-quick .dsm,#das-splash.das-quick .dsm path,#das-splash.das-quick .dsw{
    animation:none;opacity:1;transform:none;clip-path:none;will-change:auto;
    stroke-dashoffset:0;fill-opacity:1}
  #das-splash.das-quick .dsl{animation:dasFade .3s ease 1 both}
  @keyframes dasFade{0%{opacity:0;transform:scale(.985)}}

  @media (prefers-reduced-motion:reduce){
    #das-splash .dsm,#das-splash .dsm path,#das-splash .dsw,#das-splash .dsl{
      opacity:1!important;clip-path:none!important;animation:none!important;
      transform:none!important;transition:none!important;
      stroke-dashoffset:0!important;fill-opacity:1!important}
  }
</style>

<script>
  (function(){
    var el=document.getElementById('das-splash'); if(!el) return;
    var quick=false;
    try{ quick=!!sessionStorage.getItem('das_splash_seen'); sessionStorage.setItem('das_splash_seen','1'); }catch(e){}
    if(quick) el.classList.add('das-quick');
    var MIN= quick ? 420 : 2300, t0=Date.now();
    function hide(){ if(!el) return; el.classList.add('das-done');
      setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); el=null; },550); }
    function ready(){ setTimeout(hide, Math.max(0, MIN-(Date.now()-t0))); }
    if(document.readyState==='complete') ready(); else window.addEventListener('load', ready);
    setTimeout(hide, 5000);   // failsafe: never trap the page
  })();
</script>

    <!-- Benefits -->

      <div class="signup-benefit">

        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18L12.048 13.56c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042L3.964 10.71z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>

            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>

      <div class="auth-checkbox-row">
        <input type="checkbox" id="signup-terms" name="terms" required>
        <label for="signup-terms">

          and <a href="privacy.html" target="_blank">Privacy Policy</a>. I consent to receive
          order and program updates by email.

      <button class="auth-submit" type="submit" id="signup-btn">Create Account</button>
    </form>

    <p class="auth-footer-link">
      Already have an account? <a href="login.html">Sign in</a>

<script>
  // Redirect already-logged-in users
  redirectIfAuthed('account.html');

  // Password strength
  function updatePasswordStrength(pw) {
    const bar   = document.getElementById('strength-bar');
    const hint  = document.getElementById('strength-hint');
    let score   = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const map = [
      { w: '0%',   bg: '#E5E7EB', label: 'Minimum 8 characters' },
      { w: '25%',  bg: '#EF4444', label: 'Weak' },
      { w: '50%',  bg: '#F59E0B', label: 'Fair' },
      { w: '75%',  bg: '#3B82F6', label: 'Good' },
      { w: '100%', bg: '#22C55E', label: 'Strong' },
    ];
    const s = score === 0 ? 0 : Math.min(score, 4);
    bar.style.width      = map[s].w;
    bar.style.background = map[s].bg;
    hint.textContent     = map[s].label;
  }

  // Form submit
  document.getElementById('signup-form').addEventListener('submit', async e => {
    e.preventDefault();
    clearAuthError();
    const btn         = document.getElementById('signup-btn');
    const first       = document.getElementById('signup-first').value.trim();
    const last        = document.getElementById('signup-last').value.trim();
    const company     = document.getElementById('signup-company').value.trim();
    const email       = document.getElementById('signup-email').value.trim();
    const password    = document.getElementById('signup-password').value;
    const termsChecked = document.getElementById('signup-terms').checked;

    if (!first || !last || !company || !email || !password) {
      showAuthError('Please fill in all fields.');
      return;
    }
    if (password.length < 8) {
      showAuthError('Password must be at least 8 characters.');
      return;
    }
    if (!termsChecked) {
      showAuthError('Please accept the Terms & Conditions to continue.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Creating account…';
    const displayName = `${first} ${last}`;
    await createAccount(email, password, displayName, company);
    btn.disabled    = false;
    btn.textContent = 'Create Account';
  });
</script>
