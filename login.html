<style>
    /* ── Auth Page Layout ─────────────────────────────────── */
    .auth-page {
      min-height: 100vh;
      background: var(--black-2);
      display: flex;
      flex-direction: column;
    }
    .auth-nav {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(241,244,247,0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
    }
    .auth-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-padding);
    }
    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    /* ── Auth Card ────────────────────────────────────────── */
    .auth-card {
      background: #fff;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 52px 48px 44px;
      width: 100%;
      max-width: 460px;
    }
    @media (max-width: 520px) {
      .auth-card { padding: 40px 28px 36px; }
    }
    .auth-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .auth-logo-wrap img {
      height: 44px;
      width: auto;
    }
    .auth-divider-line {
      border: none;
      border-top: 1px solid var(--black-5);
      margin: 28px 0;
    }
    .auth-title {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.9375rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    /* ── Google Button ────────────────────────────────────── */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      padding: 13px 24px;
      border-radius: var(--radius-full);
      border: 1.5px solid #DADCE0;
      background: #fff;
      color: #3C4043;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
      text-decoration: none;
      margin-bottom: 20px;
    }
    .btn-google:hover {
      background: #F8F9FA;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transform: scale(1.02);
    }
    .btn-google:active { transform: scale(0.98); }
    .btn-google svg { flex-shrink: 0; }
    /* ── Separator ────────────────────────────────────────── */
    .auth-or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-weight: 500;
    }
    .auth-or::before,
    .auth-or::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--black-5);
    }
    /* ── Form Fields ──────────────────────────────────────── */
    .auth-field {
      margin-bottom: 18px;
    }
    .auth-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #D1D5DB;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      color: var(--text-primary);
      background: #fff;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
    }
    .auth-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(26,46,110,0.10);
    }
    .auth-input::placeholder { color: #9CA3AF; }
    /* Password wrapper for show/hide toggle */
    .auth-input-wrap {
      position: relative;
    }
    .auth-input-wrap .auth-input {
      padding-right: 48px;
    }
    .auth-eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
    }
    .auth-eye-btn:hover { color: var(--gold); }
    .auth-eye-btn svg { width: 18px; height: 18px; }
    .eye-closed { display: none; }
    /* ── Forgot link ──────────────────────────────────────── */
    .auth-forgot {
      display: block;
      text-align: right;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--gold);
      margin-top: -10px;
      margin-bottom: 20px;
      text-decoration: none;
    }
    .auth-forgot:hover { text-decoration: underline; text-underline-offset: 3px; }
    /* ── Submit Button ────────────────────────────────────── */
    .auth-submit {
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--gold);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: 4px;
    }
    .auth-submit:hover {
      background: var(--gold-hover);
      transform: scale(1.03);
      box-shadow: var(--shadow-gold);
    }
    .auth-submit:active { transform: scale(0.97); }
    .auth-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    /* ── Error / Success Messages ─────────────────────────── */
    #auth-error {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-sm);
      color: #B91C1C;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    /* ── Footer Link ──────────────────────────────────────── */
    .auth-footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-footer-link a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer-link a:hover { text-decoration: underline; text-underline-offset: 3px; }
    /* ── Trust badge ──────────────────────────────────────── */
    .auth-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--black-5);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .auth-trust svg { width: 14px; height: 14px; color: var(--success); flex-shrink: 0; }
  </style>
<script src="/js/tracking.js?v=3" defer></script>
</head>

<!-- ============================================================================
     DAS branded load screen (treatment A "polish"). Paints an opaque branded
     overlay INSTANTLY so the unbranded white / broken-image flash never shows on
     entry or navigation; fades out when the page is ready. Self-contained + inline
     so it paints before styles.css. Full splash once per visit, quick fade after.
     5s failsafe guarantees it never traps the page. prefers-reduced-motion aware.
     ============================================================================ -->
<style>
  /* ══ SUB-SPLASH — the Off Duty treatment, choreography matched ══════════
     First attempt was navy with a white knockout — the inverse of the
     reference. Second was the right colour but the mark just SLID: their mark
     is an inline SVG whose internal lines DRAW IN, and a PNG cannot stroke.
     Static next to theirs, and fairly called terrible.

     WHAT THEIRS ACTUALLY DOES (read off #odndr-splash):
       .osm    fly-in — translate3d(189%) scale(.2), springs on
               cubic-bezier(.34,1.56,.64,1), holds, slides home on
               cubic-bezier(.65,0,.35,1), 1.7s linear .08s both
       .oss path  the mark's HORIZONTAL LINES draw one after another —
               stroke-dashoffset 1.1 -> 0, .36s cubic-bezier(.4,0,.2,1),
               delay calc(.34s + var(--d) * 26ms)
       .osw    wordmark wipes open, clip-path inset(0 100% 0 0) -> 0,
               .56s cubic-bezier(.33,0,.2,1) at 1.68s

     WHY BANDS. Their mark is a circle crossed by horizontal rules, so
     "drawing" it means revealing those rules in sequence. The DAS mark is a
     chevron shield — hand-tracing it to strokable SVG would produce a worse
     mark than the real artwork. So the same artwork is layered 14 times, each
     clipped to one horizontal band, each carrying THEIR stagger: .34s start,
     26ms apart, .36s each, same easing. The mark builds top to bottom in
     sequence instead of appearing at once, which is what the eye reads as
     drawing. Every number above is theirs; only the mechanism differs, because
     ours is raster and theirs is vector.

     Self-contained and inline so it paints before styles.css. */
  html.das-splash-seen #das-splash{display:none!important}
  #das-splash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:0 24px;
    background:#fff;transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility linear .5s}
  #das-splash.das-done{opacity:0;visibility:hidden;pointer-events:none}
  #das-splash .dsl{position:relative;display:flex;align-items:center;width:min(86vw,780px);
    aspect-ratio:728/259;transform:translateZ(0);transition:transform .5s cubic-bezier(.4,0,.2,1)}
  #das-splash.das-done .dsl{transform:scale(1.03)}

  /* the mark: their fly-in, to the millisecond */
  #das-splash .dsm{position:relative;z-index:1;flex:0 0 auto;width:26.92%;opacity:0;
    transform:translate3d(189%,0,0) scale(.2);will-change:transform,opacity;
    animation:dasMark 1.7s linear .08s 1 both}
  /* One decode, fourteen paints. The mark is a background on every band and
     the bands are empty spans, so the browser fetches and decodes the artwork
     once instead of instantiating fourteen <img> elements of the same file --
     which is what made the first frame stutter. aspect-ratio gives .dsm its
     height without an image in the flow. Assets are 3x webp: the source art is
     728x259 raster, so this is the ceiling until a vector original exists. */
  #das-splash .dsm{aspect-ratio:196/251}
  #das-splash .dsm .bnd{position:absolute;inset:0;opacity:0;
    background:url(/images/logo-mark@3x.webp) center/100% 100% no-repeat;
    animation:dasDraw .36s cubic-bezier(.4,0,.2,1) 1 both;
    animation-delay:calc(.34s + var(--d) * 26ms)}
  #das-splash .dsw img{display:block;width:100%;height:auto}

  /* the wordmark: their wipe */
  #das-splash .dsw{position:relative;flex:0 0 auto;width:68.96%;margin-left:2.2%;overflow:hidden;
    clip-path:inset(0 100% 0 0);will-change:clip-path;
    animation:dasWipe .56s cubic-bezier(.33,0,.2,1) 1.68s 1 both}
  #das-splash .dsw img{display:block;width:100%;height:auto}

  @keyframes dasMark{
    0%{opacity:0;transform:translate3d(189%,0,0) scale(.2);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
    16%{opacity:1}
    36%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:linear}
    58%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes dasDraw{ from{opacity:0} to{opacity:1} }
  @keyframes dasWipe{ to{clip-path:inset(0 0 0 0)} }

  /* second visit in a session: same look, no theatre */
  #das-splash.das-quick .dsm,#das-splash.das-quick .dsm .bnd,#das-splash.das-quick .dsw{
    animation:none;opacity:1;transform:none;clip-path:none;will-change:auto}
  #das-splash.das-quick .dsl{animation:dasFade .3s ease 1 both}
  @keyframes dasFade{0%{opacity:0;transform:scale(.985)}}

  @media (prefers-reduced-motion:reduce){
    #das-splash .dsm,#das-splash .dsm .bnd,#das-splash .dsw,#das-splash .dsl{
      opacity:1!important;clip-path:none!important;animation:none!important;
      transform:none!important;transition:none!important}
  }
</style>
<div id="das-splash" role="presentation" aria-hidden="true">
  <div class="dsl">
    <span class="dsm">
      <span class="bnd" style="--d:0;clip-path:inset(0.0000% 0 92.8571% 0)"></span>
      <span class="bnd" style="--d:1;clip-path:inset(7.1429% 0 85.7143% 0)"></span>
      <span class="bnd" style="--d:2;clip-path:inset(14.2857% 0 78.5714% 0)"></span>
      <span class="bnd" style="--d:3;clip-path:inset(21.4286% 0 71.4286% 0)"></span>
      <span class="bnd" style="--d:4;clip-path:inset(28.5714% 0 64.2857% 0)"></span>
      <span class="bnd" style="--d:5;clip-path:inset(35.7143% 0 57.1429% 0)"></span>
      <span class="bnd" style="--d:6;clip-path:inset(42.8571% 0 50.0000% 0)"></span>
      <span class="bnd" style="--d:7;clip-path:inset(50.0000% 0 42.8571% 0)"></span>
      <span class="bnd" style="--d:8;clip-path:inset(57.1429% 0 35.7143% 0)"></span>
      <span class="bnd" style="--d:9;clip-path:inset(64.2857% 0 28.5714% 0)"></span>
      <span class="bnd" style="--d:10;clip-path:inset(71.4286% 0 21.4286% 0)"></span>
      <span class="bnd" style="--d:11;clip-path:inset(78.5714% 0 14.2857% 0)"></span>
      <span class="bnd" style="--d:12;clip-path:inset(85.7143% 0 7.1429% 0)"></span>

<script>
  (function(){
    var el=document.getElementById('das-splash'); if(!el) return;
    var quick=false;
    try{ quick=!!sessionStorage.getItem('das_splash_seen'); sessionStorage.setItem('das_splash_seen','1'); }catch(e){}
    if(quick) el.classList.add('das-quick');
    var MIN= quick ? 420 : 2300, t0=Date.now();
    function hide(){ if(!el) return; el.classList.add('das-done');
      setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); el=null; },550); }
    function ready(){ setTimeout(hide, Math.max(0, MIN-(Date.now()-t0))); }
    if(document.readyState==='complete') ready(); else window.addEventListener('load', ready);
    setTimeout(hide, 5000);   // failsafe: never trap the page
  })();
</script>


<!-- ── Minimal Auth Nav ──────────────────────────────────── -->
<nav class="auth-nav">
  <div class="auth-nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="Driver Appreciation Solutions" class="nav-logo-img">
    </a>
    <a href="shop.html" class="btn btn-secondary btn-sm">Back to Shop</a>
  </div>

<!-- ── Auth Body ─────────────────────────────────────────── -->
<main id="main" class="auth-body" tabindex="-1">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo-wrap">
      <img src="images/logo.png" alt="Driver Appreciation Solutions">
    </div>

    <!-- Title -->
    <p class="auth-title">Fleet Portal</p>
    <p class="auth-subtitle">Sign in to manage orders and recognition programs</p>

    <!-- Error -->
    <div id="auth-error" role="alert"></div>

    <!-- Google SSO -->
    <button class="btn-google" onclick="signInWithGoogle()">
      <!-- Google G logo -->
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18L12.048 13.56c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042L3.964 10.71z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- OR -->
    <div class="auth-or">or</div>

    <!-- Email / Password Form -->
    <form id="login-form" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="login-email">Email Address</label>
        <input class="auth-input" type="email" id="login-email" name="email"
               placeholder="fleet@yourcompany.com" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="login-password">Password</label>
        <div class="auth-input-wrap">
          <input class="auth-input" type="password" id="login-password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="auth-eye-btn"
                  onclick="togglePasswordVisibility('login-password', this)"
                  aria-label="Toggle password visibility">
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </div>
      </div>

      <a href="forgot-password.html" class="auth-forgot">Forgot password?</a>

      <button class="auth-submit" type="submit" id="login-btn">Sign In</button>
    </form>

    <!-- Set-new-password form — shown when arriving from a password-reset link -->
    <form id="recovery-form" novalidate style="display:none">
      <p style="font-size:0.9375rem;color:#475569;margin:0 0 16px">Choose a new password for your account.</p>
      <div class="auth-field">
        <label class="auth-label" for="recovery-password">New password</label>
        <input class="auth-input" type="password" id="recovery-password" placeholder="At least 8 characters" autocomplete="new-password" required>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="recovery-password2">Confirm new password</label>
        <input class="auth-input" type="password" id="recovery-password2" placeholder="Re-enter new password" autocomplete="new-password" required>
      </div>
      <button class="auth-submit" type="submit" id="recovery-btn">Set new password</button>
    </form>

    <!-- Footer links -->
    <p class="auth-footer-link">
      Don't have an account? <a href="signup.html">Create account</a>
    </p>

    <!-- Trust badge -->
    <div class="auth-trust">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
      Secured with 256-bit SSL · Your data is never shared
    </div>

  </div>
</main>

<script>
  // ── Password-reset (recovery) handling ──────────────────────────────────────
  // A reset link lands here with a transient recovery session. We must NOT bounce the
  // user to /account (which the normal auth redirect would do) — instead show a
  // set-new-password form and call supabase.auth.updateUser({ password }).
  const isRecovery = /type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search);

  function showRecoveryForm() {
    ['.btn-google', '.auth-or', '#login-form', '.auth-forgot'].forEach(sel => {
      const el = document.querySelector(sel); if (el) el.style.display = 'none';
    });
    const rf = document.getElementById('recovery-form'); if (rf) rf.style.display = '';
    const title = document.querySelector('.auth-title'); if (title) title.textContent = 'Set a New Password';
    const sub = document.querySelector('.auth-subtitle'); if (sub) sub.textContent = 'Enter a new password to finish resetting your account.';
  }

  if (isRecovery) {
    showRecoveryForm();
  } else {
    // Only auto-redirect signed-in users when this is NOT a recovery visit.
    redirectIfAuthed('account.html');
  }

  // Supabase fires PASSWORD_RECOVERY after it parses the link hash — catch it too (robust).
  try {
    const _sb = (typeof getSupabase === 'function') ? getSupabase() : null;
    if (_sb && _sb.auth && _sb.auth.onAuthStateChange) {
      _sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') showRecoveryForm(); });
    }
  } catch (e) { /* noop */ }

  // Recovery form submit → set the new password
  document.getElementById('recovery-form').addEventListener('submit', async e => {
    e.preventDefault();
    clearAuthError();
    const btn = document.getElementById('recovery-btn');
    const pw  = document.getElementById('recovery-password').value;
    const pw2 = document.getElementById('recovery-password2').value;
    if (pw.length < 8) { showAuthError('Password must be at least 8 characters.'); return; }
    if (pw !== pw2)    { showAuthError('Those passwords don’t match.'); return; }
    const sb = (typeof getSupabase === 'function') ? getSupabase() : null;
    if (!sb) { showAuthError('Unable to reset password right now. Please try the reset link again.'); return; }
    btn.disabled = true; btn.textContent = 'Updating…';
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { showAuthError(error.message || 'Could not update password.'); btn.disabled = false; btn.textContent = 'Set new password'; return; }
    window.location.href = 'account.html';
  });

  // Form submit
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    clearAuthError();
    const btn = document.getElementById('login-btn');
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) {
      showAuthError('Please enter your email and password.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';
    await signInWithEmail(email, password);
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
</script>

<script src="js/das-popups.js?v=5" defer></script>
