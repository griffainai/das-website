    .v-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .v-btn {

      border: 1px solid rgba(255,255,255,0.28); background: transparent; color: #fff;

    .v-btn svg { width: 15px; height: 15px; }
    .v-btn-gold { background: #C8A24A; border-color: #C8A24A; color: #0C1840; }
    .v-btn-gold:hover { background: #d4b25f; }

    /* ── Stage ── */
    .v-stage { flex: 1; min-height: 0; position: relative; background: #0C1840; }
    #v-frame { width: 100%; height: 100%; border: none; background: #fff; display: none; }

    /* ── States ── */
    .v-state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 40px 24px; text-align: center; color: #fff;
    }
    .v-state-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7);
    }
    .v-state-icon svg { width: 26px; height: 26px; }
    .v-state-title { font-size: 1.15rem; font-weight: 700; }
    .v-state-msg { font-size: 0.9rem; color: rgba(255,255,255,0.66); max-width: 380px; line-height: 1.55; }
    .v-state-link {
      margin-top: 6px; display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px; background: #C8A24A; color: #0C1840;
      font-size: 0.85rem; font-weight: 700; text-decoration: none;

    .v-spinner {

      animation: v-spin 800ms linear infinite;

      .v-brand-sub { display: none; }
      .v-btn { padding: 8px 11px; }

<!-- ============================================================================
     DAS branded load screen (treatment A "polish"). Paints an opaque branded
     overlay INSTANTLY so the unbranded white / broken-image flash never shows on
     entry or navigation; fades out when the page is ready. Self-contained + inline
     so it paints before styles.css. Full splash once per visit, quick fade after.
     5s failsafe guarantees it never traps the page. prefers-reduced-motion aware.
     ============================================================================ -->
<style>
  /* ══ SUB-SPLASH — the Off Duty treatment, choreography matched ══════════
     First attempt was navy with a white knockout — the inverse of the
     reference. Second was the right colour but the mark just SLID: their mark
     is an inline SVG whose internal lines DRAW IN, and a PNG cannot stroke.
     Static next to theirs, and fairly called terrible.

     WHAT THEIRS ACTUALLY DOES (read off #odndr-splash):
       .osm    fly-in — translate3d(189%) scale(.2), springs on
               cubic-bezier(.34,1.56,.64,1), holds, slides home on
               cubic-bezier(.65,0,.35,1), 1.7s linear .08s both
       .oss path  the mark's HORIZONTAL LINES draw one after another —
               stroke-dashoffset 1.1 -> 0, .36s cubic-bezier(.4,0,.2,1),
               delay calc(.34s + var(--d) * 26ms)
       .osw    wordmark wipes open, clip-path inset(0 100% 0 0) -> 0,
               .56s cubic-bezier(.33,0,.2,1) at 1.68s

     WHY BANDS. Their mark is a circle crossed by horizontal rules, so
     "drawing" it means revealing those rules in sequence. The DAS mark is a
     chevron shield — hand-tracing it to strokable SVG would produce a worse
     mark than the real artwork. So the same artwork is layered 14 times, each
     clipped to one horizontal band, each carrying THEIR stagger: .34s start,
     26ms apart, .36s each, same easing. The mark builds top to bottom in
     sequence instead of appearing at once, which is what the eye reads as
     drawing. Every number above is theirs; only the mechanism differs, because
     ours is raster and theirs is vector.

     Self-contained and inline so it paints before styles.css. */
  html.das-splash-seen #das-splash{display:none!important}
  #das-splash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:0 24px;
    background:#fff;transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility linear .5s}
  #das-splash.das-done{opacity:0;visibility:hidden;pointer-events:none}
  #das-splash .dsl{position:relative;display:flex;align-items:center;width:min(86vw,780px);
    aspect-ratio:728/259;transform:translateZ(0);transition:transform .5s cubic-bezier(.4,0,.2,1)}
  #das-splash.das-done .dsl{transform:scale(1.03)}

  /* the mark: their fly-in, to the millisecond */
  #das-splash .dsm{position:relative;z-index:1;flex:0 0 auto;width:26.92%;opacity:0;
    transform:translate3d(189%,0,0) scale(.2);will-change:transform,opacity;
    animation:dasMark 1.7s linear .08s 1 both}
  /* ── THE MARK IS A VECTOR NOW, SO IT DRAWS ────────────────────────────
     Jayden asked why Off Duty's splash is so clean and ours was not. Theirs is
     an inline SVG: resolution-independent, a couple of KB, and — the part that
     actually matters — its geometry can be STROKE-DRAWN. Ours was a 728x259
     PNG, and a raster can only be scaled. Fourteen clipped copies fading in
     sequence was the closest a bitmap could get to drawing, and it read as the
     imitation it was.

     There was no DAS vector anywhere in the repo, so one was made: the mark is
     flat two-colour geometry with straight edges, and the print PDF for the
     Journal of Driver Recognition embeds it at 458x567. scripts/vectorize-mark.py
     traces that into 533 vertices of real path data — 7.7KB, against 56KB for
     the raster it replaces — and normalises it back to the lockup's true
     198x253 proportions, because the PDF's copy is stretched 4.6% wide.

     Now it genuinely draws. pathLength="1" lets the dash animate in units of
     one without anybody measuring the path: silhouette first, navy inlays
     after, then both fills come up underneath the line. Their stagger, their
     easing, our artwork. */
  #das-splash .dsm{aspect-ratio:192.90/247.26}
  #das-splash .dsm svg{display:block;width:100%;height:auto;overflow:visible}
  #das-splash .dsm path{
    fill-opacity:0; stroke-width:1.4; stroke-linejoin:round; vector-effect:non-scaling-stroke;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:dasDraw .64s cubic-bezier(.4,0,.2,1) both, dasFill .36s ease both;
  }
  #das-splash .dsm .p1{ stroke:#96A0AF; fill:#96A0AF; animation-delay:.30s, .88s }
  #das-splash .dsm .p2{ stroke:#1A2E5A; fill:#1A2E5A; animation-delay:.46s, 1.00s }
  #das-splash .dsw img{display:block;width:100%;height:auto}

  /* the wordmark: their wipe */
  #das-splash .dsw{position:relative;flex:0 0 auto;width:68.96%;margin-left:2.2%;overflow:hidden;
    clip-path:inset(0 100% 0 0);will-change:clip-path;
    animation:dasWipe .56s cubic-bezier(.33,0,.2,1) 1.68s 1 both}
  #das-splash .dsw img{display:block;width:100%;height:auto}

  @keyframes dasMark{
    0%{opacity:0;transform:translate3d(189%,0,0) scale(.2);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
    16%{opacity:1}
    36%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:linear}
    58%{opacity:1;transform:translate3d(189%,0,0) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes dasDraw{ to{stroke-dashoffset:0} }
  @keyframes dasFill{ to{fill-opacity:1} }
  @keyframes dasWipe{ to{clip-path:inset(0 0 0 0)} }

  /* second visit in a session: same look, no theatre */
  #das-splash.das-quick .dsm,#das-splash.das-quick .dsm path,#das-splash.das-quick .dsw{
    animation:none;opacity:1;transform:none;clip-path:none;will-change:auto;
    stroke-dashoffset:0;fill-opacity:1}
  #das-splash.das-quick .dsl{animation:dasFade .3s ease 1 both}
  @keyframes dasFade{0%{opacity:0;transform:scale(.985)}}

  @media (prefers-reduced-motion:reduce){
    #das-splash .dsm,#das-splash .dsm path,#das-splash .dsw,#das-splash .dsl{
      opacity:1!important;clip-path:none!important;animation:none!important;
      transform:none!important;transition:none!important;
      stroke-dashoffset:0!important;fill-opacity:1!important}
  }
</style>

<script>
  (function(){
    var el=document.getElementById('das-splash'); if(!el) return;
    var quick=false;
    try{ quick=!!sessionStorage.getItem('das_splash_seen'); sessionStorage.setItem('das_splash_seen','1'); }catch(e){}
    if(quick) el.classList.add('das-quick');
    var MIN= quick ? 420 : 2300, t0=Date.now();
    function hide(){ if(!el) return; el.classList.add('das-done');
      setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); el=null; },550); }
    function ready(){ setTimeout(hide, Math.max(0, MIN-(Date.now()-t0))); }
    if(document.readyState==='complete') ready(); else window.addEventListener('load', ready);
    setTimeout(hide, 5000);   // failsafe: never trap the page
  })();
</script>

    var SUPABASE_URL = 'https://afqrwezmwfgwakgfdcty.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcXJ3ZXptd2Znd2FrZ2ZkY3R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxOTQxODMsImV4cCI6MjA5NDc3MDE4M30.PAwlexLGMrC9Pat8N2ga_jCKnyUPItJFFNRBpItt4IM';

    function $(id) { return document.getElementById(id); }
    var _pubRow = null;
    function showError(title, msg) {
      $('v-loading').style.display = 'none';
      $('v-frame').style.display = 'none';
      if (title) $('v-error-title').textContent = title;
      if (msg) $('v-error-msg').textContent = msg;
      $('v-error').style.display = 'flex';
    }

    function getId() {
      var p = new URLSearchParams(window.location.search);
      return (p.get('id') || '').trim();
    }

    window.vPrint = function () {
      var f = $('v-frame');
      try { f.contentWindow.focus(); f.contentWindow.print(); }
      catch (e) { window.print(); }
    };

    // Build a real .pdf in the browser and save it to the visitor's Downloads.
    // Falls back to the print dialog (Save as PDF) if the PDF libs can't load.
    window.vDownload = function () {
      var btn = $('v-download');
      var lbl = $('v-download-label');
      if (!window.PubPDF || !window.PubPDF.download || !_pubRow) { window.vPrint(); return; }
      if (btn) btn.disabled = true;
      if (lbl) { lbl.dataset.label = lbl.textContent; lbl.textContent = 'Preparing…'; }
      window.PubPDF.download(_pubRow)
        .catch(function (e) { alert((e && e.message) || 'Could not create the PDF. Try Print / Save PDF instead.'); })
        .then(function () {
          if (btn) btn.disabled = false;
          if (lbl) lbl.textContent = (lbl.dataset.label || 'Download PDF');
        });
    };

    async function boot() {
      var id = getId();
      if (!id) { showError('No newsletter selected', 'This link is missing a newsletter id.'); return; }

      if (!window.supabase || !window.supabase.createClient) {
        showError('Could not load', 'The viewer failed to initialize. Please refresh.'); return;
      }
      if (!window.PubRender || !window.PubRender.buildNewsletterHTML) {
        showError('Could not load', 'The renderer failed to initialize. Please refresh.'); return;
      }

      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var row, error;
      try {
        var res = await sb.from('das_publications').select('*').eq('id', id).maybeSingle();
        row = res.data; error = res.error;
      } catch (e) { error = e; }

      if (error) { showError('Could not load', 'Something went wrong loading this newsletter.'); return; }
      if (!row)  { showError('Newsletter not found', 'This newsletter may be unpublished or the link is incorrect.'); return; }
      if (row.status !== 'published') {
        showError('Not published yet', 'This newsletter has not been published. Check back soon.'); return;
      }

      _pubRow = row;

      // header text
      var label = window.PubRender.issueLabel ? window.PubRender.issueLabel(row) : '';
      var titleText = row.title || 'Driver Newsletter';
      $('v-title').textContent = titleText;
      var company = (row.settings && row.settings.company_name) || '';
      $('v-sub').textContent = [company, label].filter(Boolean).join(' · ') || 'Driver Appreciation Solutions';
      document.title = titleText + ' — Driver Appreciation Solutions';

      // render newsletter into the sandboxed frame
      var html;
      try { html = window.PubRender.buildNewsletterHTML(row); }
      catch (e) { showError('Could not render', 'This newsletter could not be displayed.'); return; }

      var frame = $('v-frame');
      frame.srcdoc = html;
      frame.onload = function () {
        $('v-loading').style.display = 'none';
        frame.style.display = 'block';
        $('v-actions').style.display = 'flex';
        var dl = $('v-download');
        if (dl) dl.style.display = 'inline-flex';   // client-side PDF — always available
      };
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
