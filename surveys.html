<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Answer the DAS driver feedback survey, the organization-wide recognition assessment, or the 2027 Driver Recognition Commitment Guide online. One question at a time, tap to answer, minutes not paperwork.">
  <link rel="canonical" href="https://www.driverappreciationsolutions.com/surveys">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Driver Appreciation Solutions">
  <meta property="og:title" content="Driver Recognition Surveys — Driver Appreciation Solutions">
  <meta property="og:description" content="Tell us how recognition actually works where you drive — one question at a time. Or complete your organization's recognition assessment and 2027 commitment plan.">
  <meta property="og:image" content="https://www.driverappreciationsolutions.com/images/og-default.jpg">
  <meta property="og:url" content="https://www.driverappreciationsolutions.com/surveys">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Driver Recognition Surveys — Driver Appreciation Solutions">
  <meta name="twitter:image" content="https://www.driverappreciationsolutions.com/images/og-default.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo:wght@300;400;600;700;900&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo:wght@300;400;600;700;900&display=swap">
  <link rel="stylesheet" href="css/das-illustrations.css">
  <link rel="stylesheet" href="css/survey.css?v=2">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/images/favicon-mark.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <meta name="theme-color" content="#16264F">
  <style>
    /* The funnel owns the viewport — no site chrome, no page margin. styles.css is
       deliberately NOT loaded: this page shares the brand (Anton, Chivo, the navy
       family, the prism) but none of the marketing site's layout, and pulling in
       that stylesheet would only fight the stage. Entry is the nav link on every
       other page; Exit (top right) goes back to the site. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0B1430; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    .svq-brand {
      position: absolute; top: 15px; left: clamp(16px, 4vw, 40px); z-index: 5;
      display: inline-flex; align-items: center; opacity: .92;
    }
    .svq-brand img {
      /* No transition on height: it triggers layout on every screen change, which is
         jank on a low-end phone. The lockup steps between its two sizes instantly. */
      height: 42px; width: auto; display: block; filter: brightness(0) invert(1);
    }
    body.svq-intro .svq-brand img { height: 60px; }
    .svq-top { padding-top: 62px; }
    body.svq-intro .svq-top { padding-top: 80px; }
    .skip-link {
      position: absolute; left: -9999px; background: #fff; color: #16264F;
      padding: 10px 16px; z-index: 20; border-radius: 6px; font-family: 'Chivo', sans-serif;
    }
    .skip-link:focus { left: 16px; top: 60px; }
  </style>
</head>
<body>

<a href="#svq-stage" class="skip-link">Skip to the questions</a>

<div class="svq" id="svq" data-accent="0">

  <a class="svq-brand" href="/" aria-label="Driver Appreciation Solutions — home">
    <img src="images/logo.png" alt="Driver Appreciation Solutions">
  </a>

  <!-- The ground. Three DAS drawings, large and quiet, sitting behind every screen.
       Replaces the ghosted word. Symbols come from js/das-sprite.js (inlined — iOS
       Safari has never supported external SVG <use>). -->
  <div class="svq-field" aria-hidden="true">
    <svg class="das-ill m1" viewBox="0 0 232 100"><use href="#das-semi"/></svg>
    <svg class="das-ill m2" viewBox="0 0 84 100"><use href="#das-medal"/></svg>
    <svg class="das-ill m3" viewBox="0 0 96 100"><use href="#das-kit"/></svg>
  </div>

  <header class="svq-top" id="svq-top" style="visibility:hidden">
    <div class="svq-rail"><div class="svq-rail-fill" id="svq-rail-fill"></div></div>
    <div class="svq-meta">
      <span class="svq-meta-left">
        <span class="svq-chip" id="svq-chip">Q1</span>
        <span class="svq-section-name" id="svq-section"></span>
      </span>
      <button type="button" class="svq-exit" id="svq-exit">Exit</button>
    </div>
  </header>

  <main class="svq-stage" id="svq-stage" tabindex="-1">
    <noscript>
      <div class="svq-noscript">
        <p><strong>These surveys need JavaScript switched on.</strong></p>
        <p>If you cannot enable it, email <a href="mailto:info@driverappreciationsolutions.com">info@driverappreciationsolutions.com</a>
           or call <a href="tel:3026810995">302.681.0995</a> and we will send the printed booklets instead.</p>
      </div>
    </noscript>
  </main>

  <footer class="svq-foot" id="svq-foot"></footer>

</div>

<!-- The sprite must be INLINED: iOS Safari has never supported external SVG
     <use> references, and drivers on iPhones are this page's main audience. -->
<script src="js/das-sprite.js?v=2"></script>
<script src="js/survey-defs.js?v=2"></script>
<script src="js/survey-app.js?v=2"></script>
</body>
</html>
